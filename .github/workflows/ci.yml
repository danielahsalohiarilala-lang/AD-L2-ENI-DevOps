name: CI Tantara

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linter
        run: pip install flake8

      - name: Lint - verif erreurs critiques
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Pas de fichier Python - OK pour l'admin"

      - name: Build OK
        run: echo "CI + Lint OK - Partie 2 valide"
        
