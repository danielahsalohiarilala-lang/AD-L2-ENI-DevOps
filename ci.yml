name: CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests API
        working-directory: apps/api
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Tests collecte
        working-directory: apps/ai
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
